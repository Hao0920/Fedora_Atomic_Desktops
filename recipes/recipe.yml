---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-atomic-desktops
description: Fedora Atomic KDE with automatic GPU detection

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Atomic Desktops
      PRETTY_NAME: Fedora Atomic Desktops
      VARIANT: KDE Edition
      VARIANT_ID: kde
      ID: fedora
      ID_LIKE: fedora

  - type: dnf
    repos:
      cleanup: true
    install:
      packages:
        - pciutils
        - gum
        - micro
        - fastfetch
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      packages:
        - libva-intel-driver
        - libva-intel-media-driver
        - intel-media-driver
        - mesa-dri-drivers
        - mesa-vulkan-drivers

  - type: files
    files:
      - source: scripts
        destination: /usr/local/bin
      - source: systemd
        destination: /etc/systemd/system

  - type: systemd
    system:
      enabled:
        - live-detect.service

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - org.kde.kate

  - type: signing
