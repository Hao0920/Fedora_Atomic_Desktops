---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-atomic-desktops
description: Fedora Atomic KDE with automatic GPU detection

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Atomic Desktops
      PRETTY_NAME: Fedora Atomic Desktops
      VARIANT: KDE Edition
      VARIANT_ID: kde
      ID: fedora
      ID_LIKE: fedora

  - from-file: common/base.yml

  - type: signing
