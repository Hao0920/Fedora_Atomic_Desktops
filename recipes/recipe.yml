---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: Fedora_Atomic_Desktops
description: Fedora Atomic KDE with automatic GPU detection

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Atomic Desktops
      PRETTY_NAME: Fedora Atomic Desktops
      VARIANT: KDE Edition
      VARIANT_ID: kde
      ID: fedora
      ID_LIKE: fedora

  # 基础包
  - type: dnf
    repos:
      cleanup: true
    install:
      packages:
        - pciutils        # lspci 检测
        - gum             # 图形化界面
        - micro           # 文本编辑器
        - fastfetch       # 系统信息
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Intel VAAPI（核显硬件加速）
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      packages:
        - libva-intel-driver      # 1st-4th Gen
        - libva-intel-media-driver  # 5th Gen+ / Arc
        - intel-media-driver
        - mesa-dri-drivers
        - mesa-vulkan-drivers

  # 复制检测脚本
  - type: files
    files:
      - source: scripts
        destination: /usr/local/bin
      - source: systemd
        destination: /etc/systemd/system

  # 启用 Live 检测服务
  - type: systemd
    system:
      enabled:
        - live-detect.service

  # Flatpak
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - org.kde.kate

  - type: signing
