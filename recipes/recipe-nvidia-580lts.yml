
---
name: fedora-atomic-desktops
description: Fedora Atomic KDE with NVIDIA 580 LTS proprietary kernel driver for Maxwell, Pascal and Volta GPUs
alt-tags:
  - nvidia-580lts

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Atomic Desktops
      PRETTY_NAME: Fedora Atomic Desktops (NVIDIA 580 LTS)
      VARIANT: KDE Edition
      VARIANT_ID: kde
      ID: fedora
      ID_LIKE: fedora

  - from-file: common/base.yml
  - from-file: common/desktop.yml

  # GTX 1050 Ti (Pascal) requires the proprietary NVIDIA kernel module.
  - type: akmods
    nvidia-driver: nvidia
    install: []

  - type: signing
