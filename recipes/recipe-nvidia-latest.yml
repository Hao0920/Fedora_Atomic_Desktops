
---
name: fedora-atomic-desktops
description: Fedora Atomic KDE with current NVIDIA open kernel driver for Turing and newer GPUs
alt-tags:
  - nvidia-latest

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Atomic Desktops
      PRETTY_NAME: Fedora Atomic Desktops (NVIDIA Current)
      VARIANT: KDE Edition
      VARIANT_ID: kde
      ID: fedora
      ID_LIKE: fedora

  - from-file: common/base.yml
  - from-file: common/desktop.yml

  - type: akmods
    nvidia-driver: nvidia-open
    install: []

  - type: signing
